<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(20px) translateX(-20px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .glow-orb-1 {
        transform-origin: 200px 180px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 180px;
        animation: pulseGlow 10s ease-in-out infinite reverse;
      }
      .particle-1 {
        animation: floatParticle1 6s ease-in-out infinite;
      }
      .particle-2 {
        animation: floatParticle2 7s ease-in-out infinite;
      }
      .circuit-line {
        stroke-dasharray: 20 15;
        animation: flowLine 20s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#cyberGrid)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background (behind content) -->
  <circle class="glow-orb-1" cx="200" cy="180" r="160" fill="url(#glowGrad1)"/>
  <circle class="glow-orb-2" cx="1000" cy="180" r="170" fill="url(#glowGrad2)"/>

  <!-- Dynamic Animated Circuit/Flow Lines (Behind Text) -->
  <path class="circuit-line" d="M 0 80 Q 300 20, 600 80 T 1200 80" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
  <path class="circuit-line" d="M 0 280 Q 300 340, 600 280 T 1200 280" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="2"/>

  <!-- Dynamic Particles floating in subtle areas -->
  <circle class="particle-1" cx="160" cy="90" r="3" fill="#38bdf8"/>
  <circle class="particle-2" cx="1040" cy="110" r="3.5" fill="#c084fc"/>
  <circle class="particle-1" cx="220" cy="270" r="2.5" fill="#818cf8"/>
  <circle class="particle-2" cx="960" cy="260" r="3" fill="#38bdf8"/>

  <!-- Border Highlight -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Foreground Content: Header Tag Pill -->
  <g transform="translate(600, 70)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text text-anchor="middle" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED AWESOME LIST ⚡</text>
  </g>

  <!-- Foreground Content: Main Title -->
  <text class="title-text" x="600" y="145" text-anchor="middle" fill="#ffffff" font-size="38">
    Awesome High-Performance
  </text>
  <text class="title-text" x="600" y="195" text-anchor="middle" fill="url(#accentGrad)" font-size="42">
    Code Editors &amp; Developer IDEs
  </text>

  <!-- Foreground Content: Subtitle -->
  <text class="subtitle-text" x="600" y="240" text-anchor="middle" fill="#94a3b8" font-size="16">
    GPU-Accelerated • Native Rust/C++ • AI-First Coding Agents • Cloud Workspaces • FOSS Equivalents
  </text>

  <!-- Foreground Content: Bottom Feature Badges -->
  <g transform="translate(600, 285)">
    <!-- Pill 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🚀 GPU Native</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 AI-Native</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(80, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">☁️ Cloud IDEs</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(240, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⭐ Open Source</text>
    </g>
  </g>
</svg>
